<rect width="960" height="400" fill="#0b0f19"/>
<text x="480.0" y="30" font-size="17" fill="#d0dce8" text-anchor="middle" font-weight="bold">Our testbed: 8&#215; RTX PRO 6000, PCIe only &#8212; no NVLink</text>
<text x="480.0" y="50" font-size="11.5" fill="#7a8899" text-anchor="middle" font-weight="normal">nvidia-smi topo -m: PIX = same PCIe switch &#183; NODE = same NUMA &#183; SYS = across the UPI socket link</text>
