<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
<rect width="960" height="560" fill="#0b0f19"/>
<defs><marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00c8ff"/></marker><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e66767"/></marker></defs>
<text x="480.0" y="30" font-size="15" fill="#d0dce8" text-anchor="middle" font-weight="bold">The same FSDP2 dim-0 sharding, two optimizers, two very different bills</text>
<text x="480.0" y="50" font-size="10.5" fill="#7a8899" text-anchor="middle" font-weight="normal">each GPU holds whole rows of every [m&#215;n] weight (and its momentum shard)</text>
<text x="250.0" y="96" font-size="12.5" fill="#199e70" text-anchor="middle" font-weight="bold">RMNP: update row i = M&#7522; / &#8214;M&#7522;&#8214;</text>
<rect x="110" y="110.0" width="280" height="56.0" rx="5" fill="#131c2e" stroke="#00c8ff" stroke-width="1.2" opacity="1.0"/>
<text x="100" y="142.0" font-size="10" fill="#7a8899" text-anchor="end" font-weight="normal">GPU 0</text>
<rect x="110" y="170.0" width="280" height="56.0" rx="5" fill="#131c2e" stroke="#00c8ff" stroke-width="1.2" opacity="1.0"/>
<text x="100" y="202.0" font-size="10" fill="#7a8899" text-anchor="end" font-weight="normal">GPU 1</text>
<rect x="110" y="230.0" width="280" height="56.0" rx="5" fill="#131c2e" stroke="#00c8ff" stroke-width="1.2" opacity="1.0"/>
<text x="100" y="262.0" font-size="10" fill="#7a8899" text-anchor="end" font-weight="normal">GPU 2</text>
<rect x="110" y="290.0" width="280" height="56.0" rx="5" fill="#131c2e" stroke="#00c8ff" stroke-width="1.2" opacity="1.0"/>
<text x="100" y="322.0" font-size="10" fill="#7a8899" text-anchor="end" font-weight="normal">GPU 3</text>
<rect x="116" y="184.0" width="268" height="10" rx="3" fill="#199e70" opacity="0.9"/>
<line x1="130" y1="189.0" x2="370" y2="189.0" stroke="#199e70" stroke-width="4.800000000000001" opacity="0.18"/>
<line x1="130" y1="189.0" x2="370" y2="189.0" stroke="#199e70" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="250.0" y="372" font-size="9.5" fill="#199e70" text-anchor="middle" font-weight="normal">&#8214;M&#7522;&#8214; sweeps only its own row &#8212; which lives whole on one GPU &#10003;</text>
<rect x="90" y="388" width="320" height="84" rx="8" fill="rgba(25,158,112,0.08)" stroke="#199e70" stroke-width="1.2" opacity="1.0"/>
<text x="250.0" y="412" font-size="10.5" fill="#d0dce8" text-anchor="middle" font-weight="normal">every rank preconditions its own shard</text>
<text x="250.0" y="434" font-size="12.5" fill="#199e70" text-anchor="middle" font-weight="bold">communication: 0 bytes</text>
<text x="250.0" y="454" font-size="9" fill="#7a8899" text-anchor="middle" font-weight="normal">compute O(mn) elementwise, load-balanced by construction</text>
<text x="710.0" y="96" font-size="12.5" fill="#e66767" text-anchor="middle" font-weight="bold">Muon: update = NS(M) &#8776; UV&#7488;</text>
<rect x="570" y="110.0" width="280" height="56.0" rx="5" fill="#131c2e" stroke="#00c8ff" stroke-width="1.2" opacity="1.0"/>
<text x="560" y="142.0" font-size="10" fill="#7a8899" text-anchor="end" font-weight="normal">GPU 0</text>
<rect x="570" y="170.0" width="280" height="56.0" rx="5" fill="#131c2e" stroke="#00c8ff" stroke-width="1.2" opacity="1.0"/>
<text x="560" y="202.0" font-size="10" fill="#7a8899" text-anchor="end" font-weight="normal">GPU 1</text>
<rect x="570" y="230.0" width="280" height="56.0" rx="5" fill="#131c2e" stroke="#00c8ff" stroke-width="1.2" opacity="1.0"/>
<text x="560" y="262.0" font-size="10" fill="#7a8899" text-anchor="end" font-weight="normal">GPU 2</text>
<rect x="570" y="290.0" width="280" height="56.0" rx="5" fill="#131c2e" stroke="#00c8ff" stroke-width="1.2" opacity="1.0"/>
<text x="560" y="322.0" font-size="10" fill="#7a8899" text-anchor="end" font-weight="normal">GPU 3</text>
<line x1="640.0" y1="140.0" x2="640.0" y2="316.0" stroke="#e66767" stroke-width="4.800000000000001" opacity="0.18"/>
<line x1="640.0" y1="140.0" x2="640.0" y2="316.0" stroke="#e66767" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="710.0" y1="260.0" x2="710.0" y2="144.0" stroke="#e66767" stroke-width="4.800000000000001" opacity="0.18"/>
<line x1="710.0" y1="260.0" x2="710.0" y2="144.0" stroke="#e66767" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="780.0" y1="320.0" x2="780.0" y2="264.0" stroke="#e66767" stroke-width="4.800000000000001" opacity="0.18"/>
<line x1="780.0" y1="320.0" x2="780.0" y2="264.0" stroke="#e66767" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="710.0" y="372" font-size="9.5" fill="#e66767" text-anchor="middle" font-weight="normal">A = XX&#7488;: A&#7522;&#11388; = &#9001;row i, row j&#9002; &#8212; rows on DIFFERENT GPUs</text>
<rect x="550" y="388" width="320" height="84" rx="8" fill="rgba(230,103,103,0.08)" stroke="#e66767" stroke-width="1.2" opacity="1.0"/>
<text x="710.0" y="412" font-size="10.5" fill="#d0dce8" text-anchor="middle" font-weight="normal">no rank can start NS without the others' rows</text>
<text x="710.0" y="434" font-size="12.5" fill="#e66767" text-anchor="middle" font-weight="bold">all-gather full matrix: O(mn) / step</text>
<text x="710.0" y="454" font-size="9" fill="#7a8899" text-anchor="middle" font-weight="normal">+ NS matmul chain O(mn&#183;min(m,n)), needs scheduling</text>
<text x="480.0" y="532" font-size="11" fill="#00c8ff" text-anchor="middle" font-weight="normal">locality of the precondition operator &#215; geometry of the shard = the communication bill</text>
</svg>
