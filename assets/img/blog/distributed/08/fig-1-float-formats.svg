<rect x="836" y="86" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="860" y="86" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="884" y="86" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<text x="252.5" y="126" font-size="9.5" fill="#c98500" text-anchor="middle" font-weight="normal">8 exponent bits &#8594; RANGE</text>
<text x="629.5" y="126" font-size="9.5" fill="#0099c4" text-anchor="middle" font-weight="normal">23 mantissa bits &#8594; PRECISION</text>
<text x="908" y="144" font-size="10.5" fill="#7a8899" text-anchor="end" font-weight="normal">max ~3.4e38 &#183; ~7.2 decimal digits</text>
<text x="116" y="193" font-size="14" fill="#d0dce8" text-anchor="end" font-weight="bold">fp16</text>
<rect x="130" y="176" width="22" height="24" rx="3" fill="#e14d92" opacity="0.85"/>
