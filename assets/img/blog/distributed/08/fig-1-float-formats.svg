<rect x="428" y="176" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="452" y="176" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="476" y="176" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="500" y="176" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<text x="216.5" y="216" font-size="9.5" fill="#c98500" text-anchor="middle" font-weight="normal">5 exponent bits &#8594; RANGE</text>
<text x="401.5" y="216" font-size="9.5" fill="#0099c4" text-anchor="middle" font-weight="normal">10 mantissa bits &#8594; PRECISION</text>
<text x="540" y="193" font-size="10.5" fill="#e66767" text-anchor="start" font-weight="normal">max 65504 (!) &#183; min normal 6.1e-5 (!) &#183; ~3.3 digits</text>
<text x="116" y="283" font-size="14" fill="#d0dce8" text-anchor="end" font-weight="bold">bf16</text>
<rect x="130" y="266" width="22" height="24" rx="3" fill="#e14d92" opacity="0.85"/>
<rect x="159" y="266" width="22" height="24" rx="3" fill="#c98500" opacity="0.85"/>
<rect x="183" y="266" width="22" height="24" rx="3" fill="#c98500" opacity="0.85"/>
<rect x="207" y="266" width="22" height="24" rx="3" fill="#c98500" opacity="0.85"/>
<rect x="231" y="266" width="22" height="24" rx="3" fill="#c98500" opacity="0.85"/>
<rect x="255" y="266" width="22" height="24" rx="3" fill="#c98500" opacity="0.85"/>
<rect x="279" y="266" width="22" height="24" rx="3" fill="#c98500" opacity="0.85"/>
<rect x="303" y="266" width="22" height="24" rx="3" fill="#c98500" opacity="0.85"/>
<rect x="327" y="266" width="22" height="24" rx="3" fill="#c98500" opacity="0.85"/>
<rect x="356" y="266" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="380" y="266" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="404" y="266" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="428" y="266" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="452" y="266" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="476" y="266" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<rect x="500" y="266" width="22" height="24" rx="3" fill="#0099c4" opacity="0.85"/>
<text x="252.5" y="306" font-size="9.5" fill="#c98500" text-anchor="middle" font-weight="normal">8 exponent bits &#8594; RANGE</text>
<text x="437.5" y="306" font-size="9.5" fill="#0099c4" text-anchor="middle" font-weight="normal">7 mantissa bits &#8594; PRECISION</text>
<text x="540" y="283" font-size="10.5" fill="#199e70" text-anchor="start" font-weight="normal">max ~3.4e38 (same as fp32) &#183; ~2.4 digits</text>
<rect x="126" y="80" width="396" height="36" rx="6" fill="none" stroke="#00c8ff" stroke-width="1.2" opacity="1.0" stroke-dasharray="5 4"/>
<text x="322.0" y="74" font-size="9.5" fill="#00c8ff" text-anchor="middle" font-weight="normal">bf16 = fp32 with the last 16 mantissa bits cut off (cast up = pad zeros, lossless)</text>
<rect x="60" y="330" width="840" height="108" rx="8" fill="#131c2e" stroke="#7a8899" stroke-width="1" opacity="0.7"/>
<text x="80" y="356" font-size="12" fill="#e66767" text-anchor="start" font-weight="bold">fp16:</text>
<text x="140" y="356" font-size="11" fill="#d0dce8" text-anchor="start" font-weight="normal">narrow range — gradients below 6e-5 underflow toward 0, logits above 65504 overflow to inf</text>
<text x="140" y="374" font-size="10" fill="#7a8899" text-anchor="start" font-weight="normal">&#8594; needs dynamic loss scaling (multiply loss by S, divide grads by S, retune S on every inf/nan)</text>
<text x="80" y="404" font-size="12" fill="#199e70" text-anchor="start" font-weight="bold">bf16:</text>
<text x="140" y="404" font-size="11" fill="#d0dce8" text-anchor="start" font-weight="normal">fp32's range, 2.4 digits of precision — nothing under/overflows that fp32 wouldn't</text>
<text x="140" y="422" font-size="10" fill="#7a8899" text-anchor="start" font-weight="normal">&#8594; no loss scaling; the lost precision is repaid elsewhere (fp32 accumulate + fp32 state, fig. 2)</text>
</svg>
