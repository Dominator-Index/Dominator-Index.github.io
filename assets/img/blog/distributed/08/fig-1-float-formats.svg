<text x="480.0" y="30" font-size="15" fill="#d0dce8" text-anchor="middle" font-weight="bold">The same bits buy range OR precision — not both</text>
<text x="480.0" y="50" font-size="10.5" fill="#7a8899" text-anchor="middle" font-weight="normal">exponent bits decide how large/small a number can be; mantissa bits decide how many digits survive</text>
<rect x="822" y="40" width="12" height="12" rx="3" fill="#e14d92" opacity="0.85"/>
<text x="840" y="50" font-size="9.5" fill="#7a8899" text-anchor="start" font-weight="normal">sign bit</text>
<text x="116" y="103" font-size="14" fill="#d0dce8" text-anchor="end" font-weight="bold">fp32</text>
<rect x="130" y="86" width="22" height="24" rx="3" fill="#e14d92" opacity="0.85"/>
