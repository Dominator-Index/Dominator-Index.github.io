<text x="589.0" y="269.5" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">bwd blk2</text>
<rect x="658.0" y="250" width="123.0" height="32" rx="4" fill="#0099c4" opacity="0.9"/>
<text x="721.0000000000001" y="269.5" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">bwd blk1</text>
<text x="176" y="326" font-size="11" fill="#d0dce8" text-anchor="end" font-weight="normal">NCCL</text>
<text x="176" y="342" font-size="9" fill="#7a8899" text-anchor="end" font-weight="normal">stream</text>
<line x1="190" y1="350" x2="910" y2="350" stroke="rgba(0,200,255,0.15)"/>
<rect x="190.0" y="306" width="63.0" height="32" rx="4" fill="#199e70" opacity="0.9"/>
<text x="223.0" y="325.5" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">AG4</text>
<rect x="262.0" y="306" width="63.0" height="32" rx="4" fill="#199e70" opacity="0.9"/>
<text x="295.0" y="325.5" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">AG3</text>
<rect x="394.0" y="306" width="63.0" height="32" rx="4" fill="#199e70" opacity="0.9"/>
<text x="427.0" y="325.5" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">AG2</text>
<rect x="526.0" y="306" width="63.0" height="32" rx="4" fill="#199e70" opacity="0.9"/>
<text x="559.0" y="325.5" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">AG1</text>
<rect x="334.0" y="306" width="57.0" height="32" rx="4" fill="#9085e9" opacity="0.9"/>
<text x="364.0" y="325.5" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">RS4</text>
<rect x="466.0" y="306" width="57.0" height="32" rx="4" fill="#9085e9" opacity="0.9"/>
<text x="496.0" y="325.5" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">RS3</text>
<rect x="598.0" y="306" width="57.0" height="32" rx="4" fill="#9085e9" opacity="0.9"/>
<text x="628.0" y="325.5" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">RS2</text>
<rect x="730.0" y="306" width="57.0" height="32" rx="4" fill="#9085e9" opacity="0.9"/>
<text x="760.0" y="325.5" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">RS1</text>
<text x="262.0" y="368" font-size="9.5" fill="#7a8899" text-anchor="start" font-weight="normal">backward needs the params AGAIN (they were resharded) &#8594; re-AG each block, then RS its grads</text>
<rect x="190" y="398" width="720" height="66" rx="8" fill="#131c2e" stroke="rgba(0,200,255,0.2)"/>
<text x="550.0" y="422" font-size="10.5" fill="#d0dce8" text-anchor="middle" font-weight="normal">reshard_after_forward=False (ZeRO-2 semantics): skip the red ticks, keep full params until backward</text>
<text x="550.0" y="442" font-size="10.5" fill="#00c8ff" text-anchor="middle" font-weight="normal">&#8594; backward re-AG disappears, memory floor rises by one full bf16 model &#8212; measured in &#167;4</text>
</svg>
