<rect x="550.0" y="96" width="163.0" height="30" rx="4" fill="#c98500" opacity="0.9"/>
<text x="632.5" y="115.0" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">rank 2: elements 48&#8211;71</text>
<rect x="715.0" y="96" width="163.0" height="30" rx="4" fill="#e14d92" opacity="0.9"/>
<text x="797.5" y="115.0" font-size="9.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">rank 3: elements 72&#8211;95</text>
<text x="550.0" y="86" font-size="9.5" fill="#7a8899" text-anchor="middle" font-weight="normal">W.flatten()  (row-major: row 0, then row 1, ...)</text>
