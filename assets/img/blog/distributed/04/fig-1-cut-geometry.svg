<text x="480.0" y="32" font-size="16.5" fill="#d0dce8" text-anchor="middle" font-weight="bold">Same idea, different geometry: how FSDP1 and FSDP2 cut a weight matrix</text>
<text x="480.0" y="54" font-size="11.5" fill="#7a8899" text-anchor="middle" font-weight="normal">one [8&#215;12] weight W, sharded across 4 ranks &#183; color = which rank stores it</text>
<text x="60" y="104" font-size="14" fill="#9085e9" text-anchor="start" font-weight="bold">FSDP1</text>
<text x="60" y="122" font-size="9.5" fill="#7a8899" text-anchor="start" font-weight="normal">FlatParameter</text>
<rect x="220.0" y="96" width="163.0" height="30" rx="4" fill="#0099c4" opacity="0.9"/>
