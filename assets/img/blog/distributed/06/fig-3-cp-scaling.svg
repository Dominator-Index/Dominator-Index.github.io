   <g id="text_19">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #00c8ff" transform="translate(220.707592 83.67036)">compute is O(s²/N) — quadratic —</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #00c8ff" transform="translate(220.707592 94.308282)">while the ring moves only O(s/N):</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #00c8ff" transform="translate(220.707592 104.946204)">the square buys what TP couldn't afford</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #7a8899" transform="translate(49.330574 34.862526)">exactness: max err ≈ 4e-7 (fp32 rounding)</text>
