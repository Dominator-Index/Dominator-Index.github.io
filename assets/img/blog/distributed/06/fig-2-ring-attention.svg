<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00c8ff"/></marker></defs>
<rect width="960" height="520" fill="#0b0f19"/>
<text x="480.0" y="30" font-size="16" fill="#d0dce8" text-anchor="middle" font-weight="bold">Ring Attention (context parallelism): Q stays home, KV makes the round trip</text>
<text x="480.0" y="52" font-size="10.5" fill="#7a8899" text-anchor="middle" font-weight="normal">each rank owns sequence chunk k (its Q_k, K_k, V_k) &#183; KV blocks travel the ring &#183; online softmax keeps exactness</text>
<rect x="90" y="100" width="170" height="150" rx="10" fill="#131c2e" stroke="rgba(0,200,255,0.35)" stroke-width="1.3"/>
<text x="102" y="120" font-size="10.5" fill="#7a8899" text-anchor="start" font-weight="normal">GPU 0</text>
<rect x="104" y="132" width="60" height="34" rx="4" fill="#0099c4"/>
<text x="134" y="153" font-size="11" fill="#0b0f19" text-anchor="middle" font-weight="bold">Q0</text>
<text x="134" y="180" font-size="8.5" fill="#7a8899" text-anchor="middle" font-weight="normal">stays</text>
<rect x="182" y="132" width="60" height="34" rx="4" fill="#c98500"/>
<text x="212" y="153" font-size="11" fill="#0b0f19" text-anchor="middle" font-weight="bold">K,V</text>
<text x="212" y="180" font-size="8.5" fill="#c98500" text-anchor="middle" font-weight="normal">travels &#8594;</text>
<rect x="104" y="196" width="138" height="38" rx="4" fill="none" stroke="#199e70" stroke-width="1.4"/>
<text x="173" y="213" font-size="9" fill="#199e70" text-anchor="middle" font-weight="bold">O, m, l accumulate</text>
<text x="173" y="226" font-size="8" fill="#7a8899" text-anchor="middle" font-weight="normal">(online softmax)</text>
<line x1="264" y1="149" x2="296" y2="149" stroke="#c98500" stroke-width="5.4" opacity="0.22" stroke-linecap="round"/>
<line x1="264" y1="149" x2="296" y2="149" stroke="#c98500" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="300" y="100" width="170" height="150" rx="10" fill="#131c2e" stroke="rgba(0,200,255,0.35)" stroke-width="1.3"/>
<text x="312" y="120" font-size="10.5" fill="#7a8899" text-anchor="start" font-weight="normal">GPU 1</text>
