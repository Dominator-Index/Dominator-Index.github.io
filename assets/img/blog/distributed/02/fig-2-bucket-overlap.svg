<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00c8ff"/></marker></defs>
<rect width="960" height="560" fill="#0b0f19"/>
<text x="480.0" y="32" font-size="17" fill="#d0dce8" text-anchor="middle" font-weight="bold">DDP's two tricks: bucketing + overlapping comm with backward</text>
<text x="480.0" y="54" font-size="11.5" fill="#7a8899" text-anchor="middle" font-weight="normal">backward computes gradients last-layer-first &#183; a bucket fires its all-reduce the moment it fills</text>
<text x="540.0" y="92" font-size="12" fill="#e66767" text-anchor="middle" font-weight="bold">(a) one giant bucket = no overlap: comm waits for the whole backward</text>
<text x="176" y="130" font-size="11" fill="#d0dce8" text-anchor="end" font-weight="normal">compute</text>
<text x="176" y="146" font-size="9" fill="#7a8899" text-anchor="end" font-weight="normal">stream</text>
<line x1="190" y1="154" x2="890" y2="154" stroke="rgba(0,200,255,0.15)"/>
<rect x="190.0" y="108" width="102.0" height="34" rx="4" fill="#0099c4" opacity="0.9"/>
<text x="242.5" y="129.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">bwd L4</text>
<rect x="295.0" y="108" width="102.0" height="34" rx="4" fill="#0099c4" opacity="0.9"/>
<text x="347.5" y="129.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">bwd L3</text>
<rect x="400.0" y="108" width="102.0" height="34" rx="4" fill="#0099c4" opacity="0.9"/>
<text x="452.5" y="129.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">bwd L2</text>
<rect x="505.0" y="108" width="102.0" height="34" rx="4" fill="#0099c4" opacity="0.9"/>
<text x="557.5" y="129.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">bwd L1</text>
<text x="176" y="192" font-size="11" fill="#d0dce8" text-anchor="end" font-weight="normal">NCCL</text>
<text x="176" y="208" font-size="9" fill="#7a8899" text-anchor="end" font-weight="normal">stream</text>
<line x1="190" y1="216" x2="890" y2="216" stroke="rgba(0,200,255,0.15)"/>
<rect x="610.0" y="170" width="221.0" height="34" rx="4" fill="#9085e9" opacity="0.9"/>
<text x="722.0" y="191.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">all-reduce (entire model)</text>
<text x="842.0" y="192" font-size="10" fill="#e66767" text-anchor="start" font-weight="bold">&#8592; fully exposed</text>
<line x1="190" y1="226" x2="834.0" y2="226" stroke="#7a8899" stroke-width="1" marker-end="url(#arr)"/>
<text x="512.0" y="242" font-size="10" fill="#7a8899" text-anchor="middle" font-weight="normal">step time = backward + FULL all-reduce</text>
<text x="540.0" y="300" font-size="12" fill="#199e70" text-anchor="middle" font-weight="bold">(b) buckets: gradients for later layers fly while earlier layers still compute</text>
<text x="176" y="338" font-size="11" fill="#d0dce8" text-anchor="end" font-weight="normal">compute</text>
<text x="176" y="354" font-size="9" fill="#7a8899" text-anchor="end" font-weight="normal">stream</text>
<line x1="190" y1="362" x2="890" y2="362" stroke="rgba(0,200,255,0.15)"/>
<rect x="190.0" y="316" width="102.0" height="34" rx="4" fill="#0099c4" opacity="0.9"/>
<text x="242.5" y="337.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">bwd L4</text>
<rect x="295.0" y="316" width="102.0" height="34" rx="4" fill="#0099c4" opacity="0.9"/>
<text x="347.5" y="337.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">bwd L3</text>
<rect x="400.0" y="316" width="102.0" height="34" rx="4" fill="#0099c4" opacity="0.9"/>
<text x="452.5" y="337.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">bwd L2</text>
<rect x="505.0" y="316" width="102.0" height="34" rx="4" fill="#0099c4" opacity="0.9"/>
<text x="557.5" y="337.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">bwd L1</text>
<text x="176" y="400" font-size="11" fill="#d0dce8" text-anchor="end" font-weight="normal">NCCL</text>
<text x="176" y="416" font-size="9" fill="#7a8899" text-anchor="end" font-weight="normal">stream</text>
<line x1="190" y1="424" x2="890" y2="424" stroke="rgba(0,200,255,0.15)"/>
<rect x="295.0" y="378" width="95.0" height="34" rx="4" fill="#9085e9" opacity="0.9"/>
<text x="344.0" y="399.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">AR bkt1</text>
<rect x="400.0" y="378" width="95.0" height="34" rx="4" fill="#9085e9" opacity="0.9"/>
<text x="449.0" y="399.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">AR bkt2</text>
<rect x="505.0" y="378" width="95.0" height="34" rx="4" fill="#9085e9" opacity="0.9"/>
<text x="554.0" y="399.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">AR bkt3</text>
<rect x="610.0" y="378" width="95.0" height="34" rx="4" fill="#9085e9" opacity="0.9"/>
<text x="659.0" y="399.0" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">AR bkt4</text>
<text x="728.0" y="400" font-size="10" fill="#199e70" text-anchor="start" font-weight="bold">&#8592; only the tail is exposed</text>
<line x1="190" y1="434" x2="715.0" y2="434" stroke="#7a8899" stroke-width="1" marker-end="url(#arr)"/>
<text x="452.5" y="450" font-size="10" fill="#7a8899" text-anchor="middle" font-weight="normal">step time = backward + one bucket's tail</text>
<rect x="190" y="476" width="700" height="54" rx="8" fill="#131c2e" stroke="rgba(0,200,255,0.2)"/>
<text x="540.0" y="498" font-size="10.5" fill="#d0dce8" text-anchor="middle" font-weight="normal">bucket too small &#8594; pays the latency floor per bucket (post #1) &#183; too big &#8594; nothing left to overlap</text>
<text x="540.0" y="516" font-size="10.5" fill="#00c8ff" text-anchor="middle" font-weight="normal">the sweet spot is measured, not guessed &#8594; see the bucket_cap_mb sweep below</text>
</svg>
