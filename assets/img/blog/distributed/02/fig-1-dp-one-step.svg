<text x="135.0" y="196" font-size="11" fill="#d0dce8" text-anchor="middle" font-weight="normal">model replica</text>
<text x="135.0" y="212" font-size="9.5" fill="#7a8899" text-anchor="middle" font-weight="normal">(identical &#952;)</text>
<line x1="135.0" y1="230" x2="135.0" y2="250" stroke="#00c8ff" stroke-width="4.800000000000001" opacity="0.22" stroke-linecap="round"/>
<line x1="135.0" y1="230" x2="135.0" y2="250" stroke="#00c8ff" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="64" y="254" width="142" height="30" rx="4" fill="#9085e9" opacity="0.85"/>
