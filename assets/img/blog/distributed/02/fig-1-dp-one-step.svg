<rect x="40" y="356" width="880" height="40" rx="8" fill="none" stroke="#00c8ff" stroke-width="2"/>
<text x="460.0" y="381" font-size="13" fill="#00c8ff" text-anchor="middle" font-weight="bold">all-reduce:  every GPU gets  g = (g0+g1+g2+g3) / N</text>
<text x="480.0" y="428" font-size="12" fill="#d0dce8" text-anchor="middle" font-weight="normal">then each replica applies the SAME update  &#952; &#8592; &#952; &#8722; &#951;&#183;g   &#8594;   replicas stay bit-identical, forever</text>
<text x="480.0" y="470" font-size="10.5" fill="#7a8899" text-anchor="middle" font-weight="normal">the invariant: DP never approximates anything &#8212; it computes exactly what one big-batch GPU would compute</text>
