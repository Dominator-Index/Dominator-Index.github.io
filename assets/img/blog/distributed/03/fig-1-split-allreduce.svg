<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00c8ff"/></marker></defs>
<rect width="960" height="470" fill="#0b0f19"/>
<text x="480.0" y="32" font-size="17" fill="#d0dce8" text-anchor="middle" font-weight="bold">ZeRO's key move: split the all-reduce open, update in the middle</text>
<text x="480.0" y="54" font-size="11.5" fill="#7a8899" text-anchor="middle" font-weight="normal">post #1: all-reduce = reduce-scatter + all-gather &#183; after RS, rank k already owns the FULL sum of shard k</text>
<text x="80" y="100" font-size="13" fill="#e66767" text-anchor="start" font-weight="bold">DDP</text>
<rect x="200" y="74" width="130" height="40" rx="6" fill="#0099c4" opacity="0.9"/>
<text x="265" y="98" font-size="11" fill="#0b0f19" text-anchor="middle" font-weight="bold">backward</text>
<line x1="334" y1="94" x2="364" y2="94" stroke="#00c8ff" stroke-width="4.800000000000001" opacity="0.22" stroke-linecap="round"/>
<line x1="334" y1="94" x2="364" y2="94" stroke="#00c8ff" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="368" y="74" width="190" height="40" rx="6" fill="#9085e9" opacity="0.9"/>
<text x="463" y="98" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">all-reduce(g)  2(N-1)/N&#183;S</text>
<line x1="562" y1="94" x2="592" y2="94" stroke="#00c8ff" stroke-width="4.800000000000001" opacity="0.22" stroke-linecap="round"/>
