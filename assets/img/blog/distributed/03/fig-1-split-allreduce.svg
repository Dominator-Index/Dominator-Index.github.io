<text x="646" y="189" font-size="10" fill="#0b0f19" text-anchor="middle" font-weight="bold">LOCAL update of shard k</text>
<text x="646" y="203" font-size="9" fill="#0b0f19" text-anchor="middle" font-weight="normal">only 1/N of fp32 state</text>
<line x1="740" y1="192" x2="770" y2="192" stroke="#00c8ff" stroke-width="4.800000000000001" opacity="0.22" stroke-linecap="round"/>
<line x1="740" y1="192" x2="770" y2="192" stroke="#00c8ff" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="774" y="172" width="150" height="40" rx="6" fill="#9085e9" opacity="0.9"/>
<text x="849" y="196" font-size="10.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">all-gather(&#952;')</text>
<rect x="120" y="264" width="720" height="66" rx="8" fill="#131c2e" stroke="rgba(0,200,255,0.25)"/>
<text x="480" y="288" font-size="11.5" fill="#d0dce8" text-anchor="middle" font-weight="normal">same collectives, rearranged:  RS + AG = all-reduce  &#8594;  communication volume unchanged (2(N-1)/N &#183; S)</text>
<text x="480" y="310" font-size="12" fill="#00c8ff" text-anchor="middle" font-weight="bold">but each rank now stores only 1/N of the optimizer state  &#8594;  12&#936; becomes 12&#936;/N</text>
