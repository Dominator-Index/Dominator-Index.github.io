<text x="716" y="91" font-size="10.5" fill="#e66767" text-anchor="middle" font-weight="bold">every rank updates ALL &#952;</text>
<text x="716" y="106" font-size="9" fill="#7a8899" text-anchor="middle" font-weight="normal">&#8594; full fp32 state on every rank</text>
<text x="80" y="198" font-size="13" fill="#199e70" text-anchor="start" font-weight="bold">ZeRO-1</text>
<rect x="200" y="172" width="130" height="40" rx="6" fill="#0099c4" opacity="0.9"/>
