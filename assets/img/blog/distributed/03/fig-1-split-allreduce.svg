<text x="443" y="196" font-size="10.5" fill="#0b0f19" text-anchor="middle" font-weight="bold">reduce-scatter</text>
<line x1="522" y1="192" x2="552" y2="192" stroke="#00c8ff" stroke-width="4.800000000000001" opacity="0.22" stroke-linecap="round"/>
<line x1="522" y1="192" x2="552" y2="192" stroke="#00c8ff" stroke-width="1.6" marker-end="url(#arr)"/>
